<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام الحضور والانصراف | HR Attendance System</title>
    <!-- PWA Settings -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#5EAD32">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./assets/global.css">
</head>
<body>
    <div class="landing-container">
        <div class="glass-card main-selector">
            <div class="header">
                <div class="logo">
                    <img src="./assets/app_icon.png" alt="شعار حضور وانصراف" style="width: 90px; height: 90px; filter: drop-shadow(0 0 12px rgba(94, 173, 50, 0.35)); margin-bottom: 15px;">
                </div>
                <h1>حضور وانصراف</h1>
                <p>تسجيل الحضور والانصراف بسهولة</p>
            </div>
            <div class="portals-grid">
                <a href="./employee/index.html" class="portal-btn employee-btn">
                    <svg viewBox="0 0 24 24" width="32" height="32" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" class="css-i6dzq1"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    <span>بوابة الموظف</span>
                    <small>تسجيل الحضور / الانصراف</small>
                </a>
                <a href="./hr/index.html" class="portal-btn hr-btn">
                    <svg viewBox="0 0 24 24" width="32" height="32" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" class="css-i6dzq1"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
                    <span>لوحة تحكم HR</span>
                    <small>إدارة النظام والتقارير</small>
                </a>
            </div>
        </div>
    </div>
    <!-- PWA Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => {
                        console.log('Service Worker registered successfully!', reg.scope);
                        // Request notification permission if not yet requested
                        if ('Notification' in window && Notification.permission === 'default') {
                            Notification.requestPermission();
                        }
                    })
                    .catch(err => console.error('Service Worker registration failed:', err));
            });
        }
    </script>
</body>
</html>
