name: employee_mobile
description: A production-ready Flutter companion app for the HR Employee Portal with background geofencing and push notifications.
version: 1.0.0+1

publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Premium WebView with native Javascript bridge support
  flutter_inappwebview: ^6.0.0
  
  # Location & Geofencing dependencies
  geolocator: ^10.1.0
  
  # Local notifications when entering/exiting site in background
  flutter_local_notifications: ^16.1.0
  
  # Background processing to check location even when app is closed
  workmanager: ^0.5.1
  
  # Shared preferences to cache sites and attendance state locally
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
